<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">
        <section class="panel form-panel">

            <h1>{{ page_title }}</h1>

            {% if student and student._id %}
            <p class="student-id">
                شناسه MongoDB:
                <span dir="ltr">{{ student._id }}</span>
            </p>
            {% endif %}

            {% if errors %}
            <div class="error-box" role="alert">
                <strong>لطفاً موارد زیر را اصلاح کنید:</strong>

                <ul>
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form
                action="{{ form_action }}"
                method="post"
                class="student-form"
                novalidate>

                <div class="form-group">
                    <label for="name">نام و نام خانوادگی</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        minlength="2"
                        maxlength="50"
                        value="{{ form_data.name if form_data else (student.name if student else '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="age">سن</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="0"
                        max="120"
                        value="{{ form_data.age if form_data else (student.age if student else '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="birth_date">تاریخ تولد</label>
                    <input
                        type="date"
                        id="birth_date"
                        name="birth_date"
                        value="{{ form_data.birth_date if form_data else (student.birth_date if student else '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="father_name">نام پدر</label>
                    <input
                        type="text"
                        id="father_name"
                        name="father_name"
                        minlength="2"
                        maxlength="50"
                        value="{{ form_data.father_name if form_data else (student.father_name if student else '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="birth_place">محل تولد</label>
                    <input
                        type="text"
                        id="birth_place"
                        name="birth_place"
                        minlength="2"
                        maxlength="100"
                        value="{{ form_data.birth_place if form_data else (student.birth_place if student else '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">شماره تلفن</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09123456789"
                        value="{{ form_data.phone if form_data else (student.phone if student else '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">ایمیل</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        value="{{ form_data.email if form_data else (student.email if student else '') }}"
                        required>
                </div>

                <div class="form-group full-width">
                    <label for="address">آدرس</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        maxlength="200"
                        placeholder="آدرس را وارد کنید">{{ form_data.address if form_data else (student.address if student and student.address else '') }}</textarea>
                </div>

                <div class="form-actions full-width">
                    <button type="submit" class="create-button">
                        {{ submit_text }}
                    </button>

                    <a href="/" class="button cancel-button">
                        بازگشت
                    </a>
                </div>

            </form>

        </section>
    </main>

</body>
</html>
